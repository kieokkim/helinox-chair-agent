<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매장 제품 조회 v1 · 아웃도어 체어</title>
<style>
:root{
  --paper:#E4E7E7; --card:#FAFBFA; --card-2:#F0F2F1;
  --ink:#12161A; --ink-2:#5B6469; --ink-3:#8B9499;
  --rule:#C4CAC9; --rule-2:#D8DCDB;
  --anod:#17566B; --anod-lt:#E3EDF0;
  --stamp:#A8451D; --stamp-lt:#F6E7E0;
  --ok:#2F6B4F; --ok-lt:#E7F1EC;
  --warn:#8A6D1F; --warn-lt:#F5EFDD;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans: system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
.etch{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.02em}

.shell{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:stretch;background:var(--ink);color:var(--card);border-bottom:1px solid var(--ink);flex-shrink:0;flex-wrap:wrap}
.brand{padding:11px 18px;display:flex;align-items:baseline;gap:10px;border-right:1px solid #2C3338}
.brand b{font-size:13px;font-weight:650;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#7F888D;text-transform:uppercase}
.tabs{display:flex}
.tab{padding:0 16px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:#98A1A6;border-right:1px solid #2C3338}
.tab:hover{color:var(--card);background:#1C2226}
.tab[aria-selected="true"]{color:var(--card);background:#242B30;box-shadow:inset 0 -2px 0 var(--anod)}
.tab i{font-family:var(--mono);font-size:9.5px;font-style:normal;color:#5F686D}
.tab[aria-selected="true"] i{color:#8FB8C6}
.topbar .spacer{flex:1;border-right:1px solid #2C3338}
.progress{padding:0 16px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:#7F888D}
.progress b{color:var(--card);font-weight:600;font-size:12px}
.pbar{width:60px;height:4px;background:#2C3338;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);font-style:normal}

.scope-note{background:var(--warn-lt);border-bottom:1px solid #E0CE9A;padding:8px 20px;font-size:12px;color:var(--warn);display:flex;gap:8px;align-items:baseline;flex-shrink:0}
.scope-note b{font-weight:700}

.main{flex:1;display:flex;min-height:0}
.side{width:240px;flex-shrink:0;background:var(--card-2);border-right:1px solid var(--rule);overflow-y:auto;padding-bottom:40px}
.fgroup{border-bottom:1px solid var(--rule-2);padding:13px 16px}
.fgroup>.etch{display:block;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 9px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);font-size:12px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--anod);border-color:var(--anod);color:#fff;font-weight:500}
.chip .n{opacity:.6;margin-left:3px}
.hint{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.reset{margin:14px 16px 0;width:calc(100% - 32px);padding:7px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);font-size:12px;color:var(--ink-2)}
.reset:hover{border-color:var(--stamp);color:var(--stamp)}

.content{flex:1;display:flex;flex-direction:column;min-width:0}
.searchbar{padding:12px 20px;border-bottom:1px solid var(--rule);background:var(--card);display:flex;gap:10px;align-items:center;flex-shrink:0}
.searchbar input{flex:1;padding:8px 11px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);font-size:13.5px;outline:none}
.searchbar input:focus{border-color:var(--anod);box-shadow:0 0 0 2px var(--anod-lt)}
.scroller{flex:1;overflow-y:auto;padding:16px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:9px}

.pcard{background:var(--card);border:1px solid var(--rule-2);border-radius:var(--r);padding:11px 12px 10px;text-align:left;width:100%;position:relative}
.pcard:hover{border-color:var(--anod);transform:translateY(-1px)}
.pcard.discontinued{opacity:.55}
.pcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:6px}
.pcard h3{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.pbadge{font-family:var(--mono);font-size:9px;letter-spacing:.08em;padding:2px 5px;border-radius:2px;flex-shrink:0;font-weight:600;white-space:nowrap}
.pb-로우백{background:#E3EDF0;color:var(--anod)}
.pb-하이백{background:#EDE6E9;color:#7A4257}
.pb-경량{background:#E7F1EC;color:var(--ok)}
.pb-미대응{background:#EFEFEF;color:var(--ink-3)}
.pb-기타{background:#F5EFDD;color:var(--warn)}
.stateflag{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;padding:1px 5px;border-radius:2px;margin-left:6px}
.sf-품절{background:var(--stamp-lt);color:var(--stamp)}
.sf-단종{background:#E8E8E8;color:var(--ink-3)}
.specrow{display:flex;gap:11px;margin-bottom:7px;flex-wrap:wrap}
.specmini{display:flex;flex-direction:column;gap:1px}
.specmini b{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.specmini span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.trap{background:var(--stamp-lt);color:var(--stamp);font-size:10.5px;padding:3px 7px;border-radius:var(--r);margin-top:6px;line-height:1.4}
.swatches{display:flex;gap:3px;margin-top:6px}
.sw{width:12px;height:12px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
.sw-more{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-left:2px;align-self:center}

.empty{padding:60px 20px;text-align:center}
.empty p{color:var(--ink-2);font-size:14px;margin-bottom:4px}
.empty .etch{display:block;margin-bottom:14px}

.scrim{position:fixed;inset:0;background:rgba(18,22,26,.34);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.detail{position:fixed;top:0;right:0;bottom:0;width:min(540px,94vw);background:var(--card);border-left:1px solid var(--rule);transform:translateX(100%);transition:transform .2s cubic-bezier(.3,.8,.4,1);z-index:41;display:flex;flex-direction:column}
.detail.on{transform:translateX(0)}
.detail-head{padding:16px 20px 14px;border-bottom:1px solid var(--rule);flex-shrink:0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.detail-head h2{font-size:19px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.detail-head .sub{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.closebtn{width:26px;height:26px;border:1px solid var(--rule);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex-shrink:0}
.closebtn:hover{border-color:var(--stamp);color:var(--stamp)}
.detail-body{flex:1;overflow-y:auto;padding:0 20px 50px}
.dsec{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule-2)}
.dsec:first-child{margin-top:16px;border-top:none;padding-top:0}
.dsec>.etch{display:block;margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 8px;border-radius:var(--r);margin-left:-8px}
.srow>span{font-size:12.5px;color:var(--ink-2)}
.srow>b{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}
.srow>b small{font-family:var(--sans);font-size:11px;font-weight:400;color:var(--ink-3);margin-left:2px}
.axisgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.axisbox{background:var(--card-2);border:1px solid var(--rule-2);border-radius:var(--r);padding:9px 11px}
.axisbox .etch{margin-bottom:3px}
.axisbox b{font-family:var(--mono);font-size:13.5px;font-weight:600}
.axisbox b.no{color:var(--ink-3);font-weight:400}
.axisbox b.yes{color:var(--ok)}
.colorlist{display:flex;flex-wrap:wrap;gap:6px}
.colorchip{display:flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--card-2);font-size:12px}
.colorchip .sw{width:13px;height:13px}
.trapbox{border-left:2px solid var(--stamp);background:var(--stamp-lt);padding:10px 12px;border-radius:0 var(--r) var(--r) 0;margin-bottom:8px}
.trapbox .etch{color:var(--stamp);display:block;margin-bottom:3px}
.trapbox p{font-size:12.5px;line-height:1.6;color:#5E3423}
.provbox{border-left:2px solid var(--anod);background:var(--anod-lt);padding:9px 12px;border-radius:0 var(--r) var(--r) 0;font-size:12px;color:var(--ink-2);line-height:1.55}

.trapview{max-width:760px}
.trapcard{background:var(--card);border:1px solid var(--rule-2);border-left:3px solid var(--stamp);border-radius:0 var(--r) var(--r) 0;padding:13px 16px;margin-bottom:10px}
.trapcard h4{font-size:14px;font-weight:600;margin-bottom:5px}
.trapcard p{font-size:12.5px;color:var(--ink-2);line-height:1.6}

.statview{max-width:820px}
.statcard{background:var(--card);border:1px solid var(--rule-2);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.statcard header{padding:11px 15px;border-bottom:1px solid var(--rule-2);background:var(--card-2);font-size:13px;font-weight:600}
.statcard .body{padding:13px 15px;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:13px 15px}
.stat-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--anod)}
.stat-lbl{font-size:11px;color:var(--ink-3);margin-top:2px}

@media (max-width:900px){.side{display:none}.brand span{display:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><b>매장 제품 조회</b><span>v1 · 실측 데이터</span></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="find" aria-selected="true"><i>01</i>제품 찾기</button>
      <button class="tab" role="tab" data-view="trap" aria-selected="false"><i>02</i>이름 함정</button>
      <button class="tab" role="tab" data-view="stat" aria-selected="false"><i>03</i>수집 현황</button>
    </div>
    <div class="spacer"></div>
    <div class="progress">아웃도어 체어 <b id="pcov">30/30</b><div class="pbar"><i style="width:100%"></i></div></div>
  </div>
  <div class="scope-note">
    <b>범위 안내</b>
    <span>이 버전은 아웃도어 라인 체어 30개(실측 완료)만 담고 있습니다. 택티컬·홈, 테이블·코트·텐트 등은 아직 미수집이며 다음 버전에서 추가됩니다.</span>
  </div>
  <div class="main">
    <aside class="side" id="side"></aside>
    <div class="content">
      <div class="searchbar" id="sbar">
        <input type="text" id="q" placeholder="제품명, 색상으로 검색 — 예: 체어원, 코요테탄">
      </div>
      <div class="scroller" id="scroller"></div>
    </div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="detail" id="detail" aria-hidden="true"></aside>

<script>

var COLOR_GROUPS = [
  {id:"무채색", test:function(n){return /블랙|그레이|화이트|블랙아웃/.test(n) && !/코요테|포레스트/.test(n);}},
  {id:"어스톤",  test:function(n){return /코요테탄|샌드|헤리티지/.test(n);}},
  {id:"그린",   test:function(n){return /그린|포레스트/.test(n);}},
  {id:"블루",   test:function(n){return /블루|비스케이/.test(n);}},
  {id:"패턴",   test:function(n){return /멀티 블록|블록/.test(n);}},
  {id:"기타",   test:function(n){return /사이언|멜론/.test(n);}}
];

var TRAPS = CHAIRS.filter(function(c){return c.trap;});

/* ==========================================================================
   상태
   ========================================================================== */
var S = {q:"", pers:[], colorGroups:[], status:[], maxW:0, minL:0, view:"find", open:null};

function bounds(){
  var live = CHAIRS.filter(function(c){return c.wP;});
  var ws = live.map(function(c){return c.wP;});
  var ls = CHAIRS.filter(function(c){return c.load;}).map(function(c){return c.load;});
  return {wMin:Math.min.apply(null,ws), wMax:Math.max.apply(null,ws), lMin:Math.min.apply(null,ls), lMax:Math.max.apply(null,ls)};
}
var B = bounds();
function resetFilters(){ S.q=""; S.pers=[]; S.colorGroups=[]; S.status=[]; S.maxW=B.wMax; S.minL=B.lMin; }
resetFilters();

function h(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function won(n){return n==null? "—" : n.toLocaleString("ko-KR")+"원";}
function kg(g){return g==null? "—" : (g>=1000 ? (g/1000).toFixed(2).replace(/0$/,"")+"kg" : g+"g");}
function el(id){return document.getElementById(id);}
function colorGroupOf(name){ for(var i=0;i<COLOR_GROUPS.length;i++){ if(COLOR_GROUPS[i].test(name)) return COLOR_GROUPS[i].id; } return "기타"; }

function filtered(){
  var q = S.q.trim().toLowerCase();
  return CHAIRS.filter(function(c){
    if(q){
      var hay = (c.name+" "+c.p+" "+(c.colors||[]).map(function(x){return x[0];}).join(" ")).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    if(S.pers.length && S.pers.indexOf(c.p) < 0) return false;
    if(S.status.length && S.status.indexOf(c.status) < 0) return false;
    if(c.wP && c.wP > S.maxW) return false;
    if(c.load && c.load < S.minL) return false;
    if(S.colorGroups.length){
      var groups = (c.colors||[]).map(function(x){return colorGroupOf(x[0]);});
      if(!S.colorGroups.some(function(g){return groups.indexOf(g)>=0;})) return false;
    }
    return true;
  });
}

/* ==========================================================================
   사이드 필터
   ========================================================================== */
function chip(label,key,val,count){
  var on = S[key].indexOf(val) >= 0;
  return '<button class="chip" data-mk="'+key+'" data-mv="'+h(val)+'" aria-pressed="'+on+'">'+h(label)+
    (count!=null?'<span class="n">'+count+'</span>':'')+'</button>';
}
function renderSide(){
  var html = "";

  html += '<div class="fgroup"><span class="etch">성격 블록</span><div class="chips">';
  PERSONALITY.forEach(function(p){
    var n = CHAIRS.filter(function(c){return c.p===p.id;}).length;
    html += chip(p.id,"pers",p.id,n);
  });
  html += '</div><p class="hint">액세서리 대응 패턴이 갈리는 기준입니다. 상세에서 각 모델별 패턴 설명을 볼 수 있습니다.</p></div>';

  html += '<div class="fgroup"><span class="etch">패킹 무게 상한</span>'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="hint" style="margin:0">이 무게 이하만</span><b style="font-family:var(--mono);font-size:12px;color:var(--anod)">'+kg(S.maxW)+'</b></div>'+
    '<input type="range" id="rw" min="'+B.wMin+'" max="'+B.wMax+'" step="10" value="'+S.maxW+'" style="width:100%">'+
    '<p class="hint">"무거운 거 안 돼요" — 백패킹 고객용. 최경량 '+kg(B.wMin)+' ~ 최중량 '+kg(B.wMax)+'.</p></div>';

  html += '<div class="fgroup"><span class="etch">최소 내하중</span>'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="hint" style="margin:0">이 하중 이상만</span><b style="font-family:var(--mono);font-size:12px;color:var(--anod)">'+S.minL+'kg</b></div>'+
    '<input type="range" id="rl" min="'+B.lMin+'" max="'+B.lMax+'" step="5" value="'+S.minL+'" style="width:100%">'+
    '<p class="hint">"제가 좀 나가는데" — 체중 확인 시. '+B.lMin+'~'+B.lMax+'kg 분포.</p></div>';

  html += '<div class="fgroup"><span class="etch">색 계열</span><div class="chips">';
  COLOR_GROUPS.forEach(function(g){ html += chip(g.id,"colorGroups",g.id); });
  html += '</div><p class="hint">정확한 색상명은 검색창을 이용하세요.</p></div>';

  html += '<div class="fgroup"><span class="etch">판매 상태</span><div class="chips">';
  ["판매중","품절","단종"].forEach(function(s){
    var n = CHAIRS.filter(function(c){return c.status===s;}).length;
    html += chip(s,"status",s,n);
  });
  html += '</div></div>';

  html += '<button class="reset" id="rst">필터 초기화</button>';
  el("side").innerHTML = html;

  el("side").querySelectorAll("[data-mk]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var k=btn.getAttribute("data-mk"), v=btn.getAttribute("data-mv");
      var i=S[k].indexOf(v);
      if(i>=0) S[k].splice(i,1); else S[k].push(v);
      renderSide(); renderMain();
    });
  });
  var rw=el("rw"), rl=el("rl");
  if(rw) rw.addEventListener("input", function(){ S.maxW=+rw.value; renderSide(); renderMain(); var x=el("rw"); if(x) x.focus(); });
  if(rl) rl.addEventListener("input", function(){ S.minL=+rl.value; renderSide(); renderMain(); var x=el("rl"); if(x) x.focus(); });
  el("rst").addEventListener("click", function(){ resetFilters(); el("q").value=""; renderSide(); renderMain(); });
}

/* ==========================================================================
   카드

function cardHtml(c){
  var sw = (c.colors||[]).slice(0,5).map(function(x){return '<i class="sw" style="background:'+h(x[1])+'" title="'+h(x[0])+'"></i>';}).join("");
  var more = (c.colors||[]).length>5 ? '<span class="sw-more">+'+((c.colors||[]).length-5)+'</span>' : "";
  var flag = c.status==="품절" ? '<span class="stateflag sf-품절">품절</span>' : c.status==="단종" ? '<span class="stateflag sf-단종">단종</span>' : "";
  return '<button class="pcard'+(c.status==="단종"?" discontinued":"")+'" data-id="'+h(c.id)+'">'+
    '<div class="pcard-top"><h3>'+h(c.name)+flag+'</h3><span class="pbadge pb-'+h(c.p)+'">'+h(c.p)+'</span></div>'+
    (c.wP ? '<div class="specrow">'+
      '<span class="specmini"><b>'+kg(c.wP)+'</b><span>패킹무게</span></span>'+
      '<span class="specmini"><b>'+(c.load||"—")+'</b><span>내하중kg</span></span>'+
      '<span class="specmini"><b>'+won(c.price)+'</b></span></div>'
      : '<p class="hint" style="margin:2px 0 6px">공식 홈 미판매 · 호환정보만 보유</p>') +
    '<div class="swatches">'+sw+more+'</div>'+
    (c.trap ? '<div class="trap">⚠ '+h(c.trap.slice(0,42))+(c.trap.length>42?"…":"")+'</div>' : '') +
    '</button>';
}

/* ==========================================================================
   상세
   ========================================================================== */
function renderDetail(){
  var d=el("detail"), sc=el("scrim");
  if(!S.open){ d.classList.remove("on"); sc.classList.remove("on"); d.setAttribute("aria-hidden","true"); return; }
  var c = CHAIRS.filter(function(x){return x.id===S.open;})[0]; if(!c) return;

  function axis(label, val){
    var no = (val==="없음");
    return '<div class="axisbox"><span class="etch">'+h(label)+'</span><b class="'+(no?"no":"yes")+'">'+h(val)+'</b></div>';
  }

  var specs = c.size ?
    '<div class="srow"><span>전개 크기(W×L×H)</span><b>'+c.size.join(' × ')+' <small>cm</small></b></div>'+
    '<div class="srow"><span>패킹 크기(W×L×H)</span><b>'+c.pack.join(' × ')+' <small>cm</small></b></div>'+
    (c.seatH ? '<div class="srow"><span>좌면 높이</span><b>'+c.seatH+' <small>cm</small></b></div>' : '')+
    '<div class="srow"><span>사용 시 무게</span><b>'+kg(c.wU)+'</b></div>'+
    '<div class="srow"><span>패킹 시 무게</span><b>'+kg(c.wP)+'</b></div>'+
    '<div class="srow"><span>최대 허용 하중</span><b>'+c.load+' <small>kg</small></b></div>'+
    '<div class="srow"><span>가격</span><b>'+won(c.price)+'</b></div>'
    : '<p class="hint">공식 홈페이지에 판매 페이지가 없어 사이즈·무게·가격 실측이 없습니다. 호환정보(우측)는 헬리녹스 공식 호환표 기준으로 유효합니다.</p>';

  var colors = (c.colors||[]).map(function(x){
    return '<div class="colorchip"><i class="sw" style="background:'+h(x[1])+'"></i>'+h(x[0])+'</div>';
  }).join("") || '<p class="hint">색상 정보 미확보</p>';

  var pers = PERSONALITY.filter(function(p){return p.id===c.p;})[0];

  d.innerHTML =
    '<div class="detail-head"><div><h2>'+h(c.name)+'</h2>'+
      '<div class="sub"><span class="pbadge pb-'+h(c.p)+'">'+h(c.p)+'</span>'+
      (c.status==="품절"?'<span class="stateflag sf-품절">품절</span>':"")+
      (c.status==="단종"?'<span class="stateflag sf-단종">단종</span>':"")+
      '</div></div><button class="closebtn" id="dclose">✕</button></div>'+
    '<div class="detail-body">'+

      '<div class="dsec"><span class="etch">성격 블록 패턴</span><div class="provbox">'+h(pers.desc)+'</div></div>'+

      (c.trap ? '<div class="dsec"><span class="etch">주의 — 이름 함정</span><div class="trapbox"><p>'+h(c.trap)+'</p></div></div>' : '') +

      '<div class="dsec"><span class="etch">호환 액세서리 (5축)</span><div class="axisgrid">'+
        axis("볼핏",c.ballfeet)+axis("그라운드시트",c.groundsheet)+
        axis("락킹풋",c.rockingfoot)+axis("퍼스널쉐이드",c.shade)+
        axis("컵홀더",c.cupholder)+
      '</div></div>'+

      '<div class="dsec"><span class="etch">사이즈·스펙</span>'+specs+'</div>'+

      '<div class="dsec"><span class="etch">색상 '+((c.colors||[]).length)+'개</span><div class="colorlist">'+colors+'</div></div>'+

    '</div>';

  d.classList.add("on"); sc.classList.add("on"); d.setAttribute("aria-hidden","false");
  el("dclose").addEventListener("click", function(){ S.open=null; renderDetail(); });
}

/* ==========================================================================
   이름 함정 / 수집 현황 탭
   ========================================================================== */
function viewTrap(){
  var cards = TRAPS.map(function(c){
    return '<div class="trapcard"><h4>'+h(c.name)+' <span class="pbadge pb-'+h(c.p)+'" style="margin-left:6px">'+h(c.p)+'</span></h4><p>'+h(c.trap)+'</p></div>';
  }).join("");
  return '<div class="trapview"><p class="hint" style="margin-bottom:14px;font-size:12.5px">이름만 보고 추측하면 틀리는 케이스 '+TRAPS.length+'건입니다. 신입 온보딩 시 이 목록만 먼저 짚어주는 게 표 전체를 외우게 하는 것보다 효율적입니다.</p>'+cards+'</div>';
}

function viewStat(){
  var byStatus = {판매중:0,품절:0,단종:0};
  CHAIRS.forEach(function(c){ byStatus[c.status]++; });
  var withSize = CHAIRS.filter(function(c){return c.size;}).length;

  return '<div class="statview">'+
    '<div class="statcard"><header>수집 진행률</header><div class="statgrid">'+
      '<div><div class="stat-num">30/30</div><div class="stat-lbl">아웃도어 체어</div></div>'+
      '<div><div class="stat-num">0/12</div><div class="stat-lbl">택티컬 체어(예정)</div></div>'+
      '<div><div class="stat-num">0/7</div><div class="stat-lbl">HDB 체어(예정)</div></div>'+
      '<div><div class="stat-num">'+TRAPS.length+'</div><div class="stat-lbl">확인된 이름 함정</div></div>'+
    '</div></div>'+

    '<div class="statcard"><header>상태 분포</header><div class="body">'+
      '판매중 '+byStatus.판매중+'개 · 품절 '+byStatus.품절+'개 · 단종 '+byStatus.단종+'개<br>'+
      '실측 스펙 확보 '+withSize+'/30 ('+Math.round(withSize/30*100)+'%) — 단종 4개는 호환정보만 보유'+
    '</div></div>'+

    '<div class="statcard"><header>데이터 출처</header><div class="body">'+
      '· 사이즈·무게·가격: helinox.co.kr 공식 제품 페이지 (사용자 직접 복사 + 일부 자동 fetch 대조 검증)<br>'+
      '· 호환 5축(볼핏/그라운드시트/락킹풋/퍼스널쉐이드/컵홀더): 헬리녹스 공식 호환표 이미지, 130칸 전수 확인, 정확도 99.2%(비치체어 계열 1건 정정)<br>'+
      '· 색상 hex: 근사값(스와치 표시 목적, 실제 색상과 오차 있을 수 있음)<br>'+
      '· SAP 미연동 — 자재번호·재고수량·보유층 정보는 이 버전에 없음'+
    '</div></div>'+

    '<div class="statcard"><header>다음 확보 대상</header><div class="body">'+
      '1. 택티컬 12개 — 접두어 "택티컬~" 규칙 확인됨. 다만 페스티벌↔인클라인, 카페↔캔틴처럼 이름 자체가 바뀌는 예외 존재 확인 필요<br>'+
      '2. HDB 7개 — 접미사 "~홈" 규칙 확인됨<br>'+
      '3. FAQ·실패사례 — 선배 인터뷰 필요(대체 불가 항목)<br>'+
      '4. 층 배치 규칙 8행 — 액세서리 B1/1F 분할 기준 미확정'+
    '</div></div>'+
  '</div>';
}

/* ==========================================================================
   렌더 루프
   ========================================================================== */
function renderMain(){
  var sc=el("scroller"), sb=el("sbar"), sd=el("side");
  var showFind = S.view==="find";
  sb.style.display = showFind ? "flex" : "none";
  sd.style.display = showFind ? "" : "none";

  if(S.view==="find"){
    var list = filtered();
    el("pcov").textContent = list.length+"/30";
    sc.innerHTML = list.length
      ? '<div class="grid">'+list.map(cardHtml).join("")+'</div>'
      : '<div class="empty"><span class="etch">no match</span><p>조건에 맞는 제품이 없습니다.</p><p class="hint">필터를 줄이거나 초기화를 눌러보세요.</p></div>';
    sc.querySelectorAll("[data-id]").forEach(function(b){
      b.addEventListener("click", function(){ S.open=b.getAttribute("data-id"); renderDetail(); });
    });
  } else if(S.view==="trap"){
    el("pcov").textContent = TRAPS.length+" 건";
    sc.innerHTML = viewTrap();
  } else {
    el("pcov").textContent = "30/30";
    sc.innerHTML = viewStat();
  }
}

document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected","false");});
    t.setAttribute("aria-selected","true");
    S.view = t.getAttribute("data-view");
    S.open=null; renderDetail(); renderMain();
  });
});
el("q").addEventListener("input", function(e){ S.q=e.target.value; renderMain(); });
el("scrim").addEventListener("click", function(){ S.open=null; renderDetail(); });
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ S.open=null; renderDetail(); }
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); if(S.view==="find") el("q").focus(); }
});

renderSide();
renderMain();
</script>
</body>
</html>
