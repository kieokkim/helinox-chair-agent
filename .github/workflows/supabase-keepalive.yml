name: supabase-keepalive

on:
  schedule:
    # 매주 월요일, 금요일 03:00 UTC(한국시간 낮 12시)에 실행.
    # 간격 계산: 월→금 = 4일, 금→(다음주)월 = 3일. 최대 간격 4일 < 정지 기준 7일 (여유 3일).
    - cron: '0 3 * * 1,5'
  workflow_dispatch: {}   # 수동으로도 눌러서 테스트 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: name_trap_tests 테이블에 가벼운 조회 1건 날리기 (활동 기록용)
        run: |
          curl -sS "${{ secrets.SUPABASE_URL }}/rest/v1/name_trap_tests?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "status=%{http_code}\n" \
            --fail-with-body
